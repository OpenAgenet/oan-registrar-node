[workspace]
members = [
    "services/registrar-node",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/OpenAgenet/oan-registrar-node"
version = "1.0.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

oan-core = { path = "../oan-protocol-common/crates/oan-core" }
oan-credentials = { path = "../oan-protocol-common/crates/oan-credentials" }
oan-crypto = { path = "../oan-protocol-common/crates/oan-crypto" }
oan-protocol = { path = "../oan-protocol-common/crates/oan-protocol" }
oan-semantic-recommender = { path = "../oan-protocol-common/crates/oan-semantic-recommender" }
oan-service-security = { path = "../oan-protocol-common/crates/oan-service-security" }
oan-storage = { path = "../oan-protocol-common/crates/oan-storage" }

